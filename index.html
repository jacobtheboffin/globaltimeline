<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World History Timeline Generator</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React-DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #1e293b;
    }
    ::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const CATEGORIES = {
      War: { label: 'War', bg: 'bg-red-950/80', border: 'border-red-600', badge: 'bg-red-900/60 text-red-300 border-red-700', highlight: 'bg-red-950/30 border-red-800/40' },
      Invasion: { label: 'Invasion', bg: 'bg-amber-950/80', border: 'border-amber-600', badge: 'bg-amber-900/60 text-amber-300 border-amber-700', highlight: 'bg-amber-950/30 border-amber-800/40' },
      Disaster: { label: 'Disaster', bg: 'bg-purple-950/80', border: 'border-purple-600', badge: 'bg-purple-900/60 text-purple-300 border-purple-700', highlight: 'bg-purple-950/30 border-purple-800/40' },
      Founding: { label: 'Founding', bg: 'bg-emerald-950/80', border: 'border-emerald-600', badge: 'bg-emerald-900/60 text-emerald-300 border-emerald-700', highlight: 'bg-emerald-950/30 border-emerald-800/40' },
      'Civil War': { label: 'Civil War', bg: 'bg-rose-950/80', border: 'border-rose-600', badge: 'bg-rose-900/60 text-rose-300 border-rose-700', highlight: 'bg-rose-950/30 border-rose-800/40' },
      'Policy/Treaty': { label: 'Policy / Treaty', bg: 'bg-cyan-950/80', border: 'border-cyan-600', badge: 'bg-cyan-900/60 text-cyan-300 border-cyan-700', highlight: 'bg-cyan-950/30 border-cyan-800/40' },
      'Era/Economic': { label: 'Era / Economic', bg: 'bg-teal-950/80', border: 'border-teal-600', badge: 'bg-teal-900/60 text-teal-300 border-teal-700', highlight: 'bg-teal-950/30 border-teal-800/40' },
    };

    const INITIAL_COUNTRIES = [
      { id: 'c1', name: 'Roman Empire', era: 'Past', continent: 'Europe / Mediterranean' },
      { id: 'c2', name: 'Japan', era: 'Present', continent: 'Asia' },
      { id: 'c3', name: 'United States', era: 'Present', continent: 'North America' },
      { id: 'c4', name: 'Ottoman Empire', era: 'Past', continent: 'Eurasia' },
      { id: 'c5', name: 'Earth Federation', era: 'Future', continent: 'Global' },
    ];

    const INITIAL_EVENTS = [
      { id: 'e1', countryId: 'c1', title: 'Pax Romana Period', yearStart: -27, yearEnd: 180, category: 'Era/Economic', type: 'Period', description: 'Golden age of Roman peace and stability spanning two centuries.', tags: 'Empire, Golden Age' },
      { id: 'e2', countryId: 'c1', title: 'Establishment of Roman Empire', yearStart: -27, yearEnd: null, category: 'Founding', type: 'Event', description: 'Augustus becomes the first emperor.', tags: 'Augustus' },
      { id: 'e3', countryId: 'c1', title: 'Eruption of Mount Vesuvius', yearStart: 79, yearEnd: null, category: 'Disaster', type: 'Event', description: 'Destruction of Pompeii and Herculaneum.', tags: 'Pompeii' },
      { id: 'e4', countryId: 'c1', title: 'Crisis of the Third Century', yearStart: 235, yearEnd: 284, category: 'Civil War', type: 'Period', description: 'Fifty years of extreme civil instability and economic disruption.', tags: 'Crisis' },
      { id: 'e5', countryId: 'c2', title: 'Mongol Invasions of Japan', yearStart: 1274, yearEnd: 1281, category: 'Invasion', type: 'Period', description: 'Kublai Khan attempts invasions defeated by Kamikaze typhoons.', tags: 'Mongols' },
      { id: 'e6', countryId: 'c3', title: 'American Civil War', yearStart: 1861, yearEnd: 1865, category: 'Civil War', type: 'Period', description: 'Internal conflict between Northern Union and Southern Confederacy.', tags: 'Lincoln' },
      { id: 'e7', countryId: 'c4', title: 'Fall of Constantinople', yearStart: 1453, yearEnd: null, category: 'Invasion', type: 'Event', description: 'Ottomans conquer Byzantine capital.', tags: 'Mehmed II' },
      { id: 'e8', countryId: 'c5', title: 'Global Climate Accord', yearStart: 2085, yearEnd: null, category: 'Founding', type: 'Event', description: 'Unification of planetary council.', tags: 'Future' },
    ];

    function App() {
      const [countries, setCountries] = useState(() => {
        const saved = localStorage.getItem('world_history_countries');
        return saved ? JSON.parse(saved) : INITIAL_COUNTRIES;
      });

      const [events, setEvents] = useState(() => {
        const saved = localStorage.getItem('world_history_events');
        return saved ? JSON.parse(saved) : INITIAL_EVENTS;
      });

      useEffect(() => {
        localStorage.setItem('world_history_countries', JSON.stringify(countries));
      }, [countries]);

      useEffect(() => {
        localStorage.setItem('world_history_events', JSON.stringify(events));
      }, [events]);

      const [selectedCountry, setSelectedCountry] = useState('ALL');
      const [selectedCategory, setSelectedCategory] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');
      const [sortAscending, setSortAscending] = useState(true);

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isAddingCountry, setIsAddingCountry] = useState(false);
      const [editingItem, setEditingItem] = useState(null);

      const [formData, setFormData] = useState({
        countryId: '',
        title: '',
        yearStart: '',
        yearEnd: '',
        category: 'War',
        type: 'Event',
        description: '',
        tags: '',
      });

      const [newCountry, setNewCountry] = useState({ name: '', era: 'Present', continent: '' });

      const formatYear = (year) => {
        if (year === null || year === '' || isNaN(year)) return '';
        const y = Number(year);
        return y < 0 ? `${Math.abs(y)} BCE` : `${y} CE`;
      };

      const openAddModal = () => {
        setEditingItem(null);
        setFormData({ countryId: countries[0]?.id || '', title: '', yearStart: '', yearEnd: '', category: 'War', type: 'Event', description: '', tags: '' });
        setIsModalOpen(true);
      };

      const openEditModal = (item) => {
        setEditingItem(item);
        setFormData({
          countryId: item.countryId,
          title: item.title,
          yearStart: item.yearStart,
          yearEnd: item.yearEnd !== null ? item.yearEnd : '',
          category: item.category,
          type: item.type || (item.yearEnd ? 'Period' : 'Event'),
          description: item.description || '',
          tags: item.tags || '',
        });
        setIsModalOpen(true);
      };

      const handleSaveItem = (e) => {
        e.preventDefault();
        if (!formData.title || !formData.countryId || formData.yearStart === '') return;

        const payload = {
          id: editingItem ? editingItem.id : 'e_' + Date.now(),
          countryId: formData.countryId,
          title: formData.title,
          yearStart: parseInt(formData.yearStart, 10),
          yearEnd: formData.yearEnd !== '' ? parseInt(formData.yearEnd, 10) : null,
          category: formData.category,
          type: formData.type,
          description: formData.description,
          tags: formData.tags,
        };

        if (editingItem) {
          setEvents(events.map((ev) => (ev.id === editingItem.id ? payload : ev)));
        } else {
          setEvents([...events, payload]);
        }
        setIsModalOpen(false);
      };

      const handleDeleteItem = (id) => {
        if (confirm('Are you sure you want to delete this timeline item?')) {
          setEvents(events.filter((ev) => ev.id !== id));
        }
      };

      const handleAddCountry = (e) => {
        e.preventDefault();
        if (!newCountry.name) return;
        setCountries([...countries, { id: 'c_' + Date.now(), name: newCountry.name, era: newCountry.era, continent: newCountry.continent || 'Global' }]);
        setIsAddingCountry(false);
        setNewCountry({ name: '', era: 'Present', continent: '' });
      };

      const filteredEvents = useMemo(() => {
        return events
          .filter((ev) => {
            if (selectedCountry !== 'ALL' && ev.countryId !== selectedCountry) return false;
            if (selectedCategory !== 'ALL' && ev.category !== selectedCategory) return false;
            if (searchQuery.trim()) {
              const q = searchQuery.toLowerCase();
              const country = countries.find((c) => c.id === ev.countryId);
              return (
                ev.title.toLowerCase().includes(q) ||
                (ev.description && ev.description.toLowerCase().includes(q)) ||
                (country && country.name.toLowerCase().includes(q))
              );
            }
            return true;
          })
          .sort((a, b) => (sortAscending ? a.yearStart - b.yearStart : b.yearStart - a.yearStart));
      }, [events, countries, selectedCountry, selectedCategory, searchQuery, sortAscending]);

      const activePeriods = useMemo(() => {
        return filteredEvents.filter((item) => item.type === 'Period' && item.yearEnd !== null);
      }, [filteredEvents]);

      const exportJSON = () => {
        const blob = new Blob([JSON.stringify({ countries, events }, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'world_history_timeline.json';
        a.click();
      };

      return (
        <div className="max-w-7xl mx-auto px-4 py-8">
          {/* Top Bar */}
          <header className="flex flex-col md:flex-row md:items-center justify-between border-b border-slate-800 pb-6 mb-8 gap-4">
            <div>
              <h1 className="text-3xl font-extrabold text-white flex items-center gap-3">
                <span className="text-emerald-400">🌐 World History</span> Timeline Generator
              </h1>
              <p className="text-slate-400 text-sm mt-1">Relative spacing, events, and period background highlights across nations.</p>
            </div>
            <div className="flex flex-wrap gap-3">
              <button onClick={() => setIsAddingCountry(true)} className="px-4 py-2 bg-slate-800 text-slate-200 text-sm rounded-lg border border-slate-700 hover:bg-slate-700">+ Add Nation</button>
              <button onClick={openAddModal} className="px-4 py-2 bg-emerald-600 text-white text-sm rounded-lg hover:bg-emerald-500 font-semibold">+ Insert Event / Period</button>
              <button onClick={exportJSON} className="px-3 py-2 bg-slate-800 text-slate-300 text-xs font-mono rounded-lg border border-slate-700">Export JSON</button>
            </div>
          </header>

          {/* Categories Legend */}
          <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 mb-8">
            <span className="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-3">Event & Period Categories</span>
            <div className="flex flex-wrap gap-2">
              {Object.entries(CATEGORIES).map(([key, cat]) => (
                <button
                  key={key}
                  onClick={() => setSelectedCategory(selectedCategory === key ? 'ALL' : key)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-medium border transition ${cat.badge} ${selectedCategory === key ? 'ring-2 ring-white scale-105' : 'opacity-80 hover:opacity-100'}`}
                >
                  {cat.label}
                </button>
              ))}
            </div>
          </div>

          {/* Controls */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <input
              type="text"
              placeholder="Search title, description, or country..."
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
              className="bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500"
            />
            <select
              value={selectedCountry}
              onChange={(e) => setSelectedCountry(e.target.value)}
              className="bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500"
            >
              <option value="ALL">All Nations / Empires</option>
              {countries.map((c) => (<option key={c.id} value={c.id}>{c.name} ({c.era})</option>))}
            </select>
            <button
              onClick={() => setSortAscending(!sortAscending)}
              className="bg-slate-900 border border-slate-800 text-slate-300 py-2 px-3 rounded-lg text-sm hover:bg-slate-800"
            >
              Order: {sortAscending ? 'Chronological (Old → New)' : 'Reverse (New → Old)'}
            </button>
          </div>

          {/* Layout */}
          <div className="grid grid-cols-1 lg:grid-cols-4 gap-8">
            {/* Nations Sidebar */}
            <div className="lg:col-span-1 bg-slate-900 border border-slate-800 rounded-xl p-4 h-fit">
              <h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider mb-4">Nations Roster ({countries.length})</h3>
              <div className="space-y-2">
                {countries.map((c) => (
                  <div
                    key={c.id}
                    onClick={() => setSelectedCountry(selectedCountry === c.id ? 'ALL' : c.id)}
                    className={`p-3 rounded-lg border cursor-pointer ${selectedCountry === c.id ? 'bg-emerald-950/40 border-emerald-500' : 'bg-slate-950 border-slate-800 hover:border-slate-700'}`}
                  >
                    <div className="flex justify-between items-center text-sm font-semibold text-slate-200">
                      <span>{c.name}</span>
                      <span className="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-400">{c.era}</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Timeline Stream */}
            <div className="lg:col-span-3">
              {filteredEvents.length === 0 ? (
                <div className="text-center py-16 bg-slate-900 border border-slate-800 rounded-xl text-slate-400">
                  No events or periods match the filter.
                </div>
              ) : (
                <div className="relative border-l-2 border-slate-800 ml-6 pl-6">
                  {filteredEvents.map((ev, idx) => {
                    const country = countries.find((c) => c.id === ev.countryId);
                    const catStyle = CATEGORIES[ev.category] || CATEGORIES.War;
                    const isPeriod = ev.type === 'Period' || ev.yearEnd !== null;

                    // Relative distance calculations
                    let marginTopPx = 0;
                    if (idx > 0) {
                      const prevYear = filteredEvents[idx - 1].yearStart;
                      const yearDiff = Math.abs(ev.yearStart - prevYear);
                      marginTopPx = Math.min(Math.max(yearDiff * 1.5, 12), 160);
                    }

                    // Check which active Period background highlights cover this event
                    const overlappingPeriods = activePeriods.filter(
                      (p) => p.id !== ev.id && ev.yearStart >= p.yearStart && ev.yearStart <= p.yearEnd
                    );

                    return (
                      <div
                        key={ev.id}
                        style={{ marginTop: `${marginTopPx}px` }}
                        className="relative group transition-all"
                      >
                        {/* Dynamic Period Background Highlight */}
                        {overlappingPeriods.map((period) => {
                          const pStyle = CATEGORIES[period.category] || CATEGORIES['Era/Economic'];
                          return (
                            <div
                              key={period.id}
                              className={`absolute -inset-x-4 -inset-y-2 rounded-lg border ${pStyle.highlight} pointer-events-none z-0`}
                            >
                              <span className="absolute right-3 top-1 text-[9px] uppercase font-bold tracking-widest text-slate-500">
                                Inside Period: {period.title}
                              </span>
                            </div>
                          );
                        })}

                        {/* Node Bullet Point */}
                        <div className={`absolute -left-[31px] top-4 w-4 h-4 rounded-full border-2 ${catStyle.border} bg-slate-950 z-10`}></div>

                        {/* Event / Period Card */}
                        <div className={`relative z-10 p-5 rounded-xl border ${catStyle.bg} ${catStyle.border} shadow-md`}>
                          <div className="flex flex-wrap justify-between items-center mb-2 gap-2">
                            <div className="flex items-center gap-2">
                              <span className="text-xs font-mono font-bold bg-slate-900 px-2.5 py-1 rounded border border-slate-700">
                                {formatYear(ev.yearStart)}{ev.yearEnd ? ` – ${formatYear(ev.yearEnd)}` : ''}
                              </span>
                              <span className={`text-xs px-2.5 py-0.5 rounded-full font-semibold border ${catStyle.badge}`}>
                                {catStyle.label}
                              </span>
                              <span className="text-[10px] uppercase font-mono px-2 py-0.5 rounded bg-slate-900/80 text-slate-300 border border-slate-700">
                                {isPeriod ? 'Period Range' : 'Single Event'}
                              </span>
                            </div>

                            {/* Action Buttons: EDIT & DELETE */}
                            <div className="flex items-center gap-2">
                              <button
                                onClick={() => openEditModal(ev)}
                                className="px-2.5 py-1 bg-slate-900 hover:bg-slate-800 text-slate-200 text-xs font-medium rounded border border-slate-700 transition"
                              >
                                Edit
                              </button>
                              <button
                                onClick={() => handleDeleteItem(ev.id)}
                                className="px-2.5 py-1 bg-red-950/80 hover:bg-red-900 text-red-300 text-xs font-medium rounded border border-red-800 transition"
                              >
                                Delete
                              </button>
                            </div>
                          </div>

                          <h4 className="text-lg font-bold text-white mb-1">{ev.title}</h4>
                          {country && <span className="text-xs text-slate-400">🏛️ {country.name}</span>}
                          {ev.description && <p className="text-slate-300 text-sm mt-2">{ev.description}</p>}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </div>

          {/* Add / Edit Modal */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 max-w-md w-full shadow-2xl">
                <h3 className="text-xl font-bold text-white mb-4">{editingItem ? 'Edit Timeline Item' : 'Add Timeline Item'}</h3>
                <form onSubmit={handleSaveItem} className="space-y-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Item Type</label>
                    <select
                      value={formData.type}
                      onChange={(e) => setFormData({ ...formData, type: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-200"
                    >
                      <option value="Event">Event (Single Point in Time)</option>
                      <option value="Period">Period (Multi-Year Range Highlight)</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Nation / Empire *</label>
                    <select
                      required
                      value={formData.countryId}
                      onChange={(e) => setFormData({ ...formData, countryId: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-200"
                    >
                      <option value="">Select country...</option>
                      {countries.map((c) => (<option key={c.id} value={c.id}>{c.name}</option>))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Title *</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Pax Romana"
                      value={formData.title}
                      onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-200"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Start Year (Negative = BCE) *</label>
                      <input
                        type="number"
                        required
                        placeholder="-27 or 1945"
                        value={formData.yearStart}
                        onChange={(e) => setFormData({ ...formData, yearStart: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-200"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">End Year (Required for Period)</label>
                      <input
                        type="number"
                        placeholder="e.g. 180"
                        value={formData.yearEnd}
                        onChange={(e) => setFormData({ ...formData, yearEnd: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-200"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Category</label>
                    <select
                      value={formData.category}
                      onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-200"
                    >
                      {Object.keys(CATEGORIES).map((cat) => (<option key={cat} value={cat}>{cat}</option>))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Description</label>
                    <textarea
                      placeholder="Context and notes..."
                      value={formData.description}
                      onChange={(e) => setFormData({ ...formData, description: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-200"
                    ></textarea>
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 bg-slate-800 text-slate-300 text-xs rounded font-medium">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-emerald-600 text-white text-xs rounded font-semibold">{editingItem ? 'Update Item' : 'Save Item'}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Add Country Modal */}
          {isAddingCountry && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 max-w-md w-full shadow-2xl">
                <h3 className="text-xl font-bold text-white mb-4">Add Country / Empire</h3>
                <form onSubmit={handleAddCountry} className="space-y-3">
                  <input type="text" required placeholder="Country Name" value={newCountry.name} onChange={(e) => setNewCountry({ ...newCountry, name: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-200" />
                  <select value={newCountry.era} onChange={(e) => setNewCountry({ ...newCountry, era: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-200">
                    <option value="Past">Past</option>
                    <option value="Present">Present</option>
                    <option value="Future">Future</option>
                  </select>
                  <input type="text" placeholder="Continent / Region" value={newCountry.continent} onChange={(e) => setNewCountry({ ...newCountry, continent: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-200" />
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsAddingCountry(false)} className="px-4 py-2 bg-slate-800 text-slate-300 text-xs rounded font-medium">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-emerald-600 text-white text-xs rounded font-semibold">Save Country</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
