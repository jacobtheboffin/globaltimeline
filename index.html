      Settled: { label: 'Settled', bg: 'bg-lime-950/80', border: 'border-lime-600', badge: 'bg-lime-900/60 text-lime-300 border-lime-700', highlight: 'bg-lime-950/30 border-lime-800/40' },

      'Surrender/Loss': { label: 'Surrender / Loss', bg: 'bg-zinc-950/80', border: 'border-zinc-600', badge: 'bg-zinc-900/60 text-zinc-300 border-zinc-700', highlight: 'bg-zinc-950/30 border-zinc-700/40' },
      Purchase: { label: 'Purchase', bg: 'bg-emerald-900/80', border: 'border-emerald-500', badge: 'bg-emerald-800/60 text-emerald-200 border-emerald-600', highlight: 'bg-emerald-900/30 border-emerald-700/40' },

    const MILITARY_CATEGORIES = ['War', 'Invasion', 'Skirmish', 'Raid', 'Civil War'];
    const POSSESSIVE_CATEGORIES = ['Transfer', 'Purchase', 'Claim', 'Settled'];

    const INITIAL_COUNTRIES = [
      { id: 'c1', name: 'Roman Empire', era: 'Past', continent: 'Europe / Mediterranean', lat: 41.9, lng: 12.5 },
      { id: 'c2', name: 'Japan', era: 'Present', continent: 'Asia', lat: 36.2, lng: 138.25 },
      { id: 'c3', name: 'United States', era: 'Present', continent: 'North America', lat: 37.09, lng: -95.71 },
      { id: 'c4', name: 'Ottoman Empire', era: 'Past', continent: 'Eurasia', lat: 41.0, lng: 28.97 },
      { id: 'c5', name: 'Earth Federation', era: 'Future', continent: 'Global', lat: 0.0, lng: 0.0 },
    ];

    const INITIAL_EVENTS = [
      { id: 'e1', countryId: 'c1', title: 'Pax Romana Period', yearStart: -27, yearEnd: 180, category: 'Era', type: 'Period', description: 'Golden age of Roman peace and stability spanning two centuries.', tags: 'Empire, Golden Age', outcome: '', aggressorId: '', customerId: '' },
      { id: 'e2', countryId: 'c1', title: 'Establishment of Roman Empire', yearStart: -27, yearEnd: null, category: 'Founding', type: 'Event', description: 'Augustus becomes the first emperor.', tags: 'Augustus', outcome: '', aggressorId: '', customerId: '' },
      { id: 'e3', countryId: 'c3', title: 'Louisiana Purchase', yearStart: 1803, yearEnd: null, category: 'Purchase', type: 'Event', description: 'Acquisition of the territory of Louisiana from France.', tags: 'Territory, France', outcome: '', aggressorId: '', customerId: 'c4' },
    ];

    function SearchableDropdown({ countries, value, onChange, placeholder = "Select country..." }) {
      const [isOpen, setIsOpen] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');
      const wrapperRef = useRef(null);

      const sortedCountries = useMemo(() => {
        return [...countries].sort((a, b) => a.name.localeCompare(b.name));
      }, [countries]);

      const filtered = useMemo(() => {
        if (!searchTerm) return sortedCountries;
        return sortedCountries.filter(c => c.name.toLowerCase().includes(searchTerm.toLowerCase()));
      }, [sortedCountries, searchTerm]);

      const selectedCountry = countries.find(c => c.id === value);

      useEffect(() => {
        function handleClickOutside(event) {
          if (wrapperRef.current && !wrapperRef.current.contains(event.target)) {
            setIsOpen(false);
          }
        }
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      return (
        <div className="relative" ref={wrapperRef}>
          <div
            onClick={() => setIsOpen(!isOpen)}
            className="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-200 cursor-pointer flex justify-between items-center"
          >
            <span>{selectedCountry ? selectedCountry.name : placeholder}</span>
            <span className="text-xs text-slate-400">▼</span>
          </div>

          {isOpen && (
            <div className="absolute z-50 mt-1 w-full bg-slate-900 border border-slate-700 rounded-lg shadow-2xl max-h-60 overflow-y-auto">
              <div className="p-2 border-b border-slate-800 sticky top-0 bg-slate-900">
                <input
                  type="text"
                  autoFocus
                  placeholder="Type to search country..."
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500"
                />
              </div>
              <div className="py-1">
                {filtered.length === 0 ? (
                  <div className="px-3 py-2 text-xs text-slate-500">No matching countries found</div>
                ) : (
                  filtered.map((c) => (
                    <div
                      key={c.id}
                      onClick={() => {
                        onChange(c.id);
                        setIsOpen(false);
                        setSearchTerm('');
                      }}
                      className={`px-3 py-2 text-sm cursor-pointer hover:bg-slate-800 flex justify-between items-center ${value === c.id ? 'bg-emerald-950/60 text-emerald-300 font-medium' : 'text-slate-200'}`}
                    >
                      <span>{c.name}</span>
                    </div>
                  ))
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // Fully Working Interactive Globe Canvas Component
    function GlobeCanvas({ country }) {
      const canvasRef = useRef(null);
      const [rotation, setRotation] = useState(0);
      const isDragging = useRef(false);
      const lastMouseX = useRef(0);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        const render = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const centerX = canvas.width / 2;
          const centerY = canvas.height / 2;
          const radius = 80;

          // Draw Globe Sphere Base
          const gradient = ctx.createRadialGradient(centerX - 25, centerY - 25, 10, centerX, centerY, radius);
          gradient.addColorStop(0, '#1e293b');
          gradient.addColorStop(1, '#020617');
          ctx.beginPath();
          ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
          ctx.fillStyle = gradient;
          ctx.fill();
          ctx.strokeStyle = '#334155';
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.closePath();

          // Draw grid lines
          ctx.strokeStyle = '#1e293b';
          ctx.lineWidth = 1;
          for (let i = -2; i <= 2; i++) {
            ctx.beginPath();
            ctx.arc(centerX, centerY + i * 25, radius * Math.cos(i * 0.3), 0, Math.PI * 2);
            ctx.stroke();
          }

          // Render country target pin
          if (country && typeof country.lat === 'number' && typeof country.lng === 'number') {
            const phi = (90 - country.lat) * (Math.PI / 180);
            const theta = (country.lng + rotation) * (Math.PI / 180);

            const x = centerX + radius * Math.sin(phi) * Math.cos(theta);
            const y = centerY + radius * Math.cos(phi);
            const z = Math.sin(phi) * Math.sin(theta);

            if (z > -0.3) {
              // Glowing Pin Marker
              ctx.beginPath();
              ctx.arc(x, y, 6, 0, Math.PI * 2);
              ctx.fillStyle = '#10b981';
              ctx.shadowColor = '#10b981';
              ctx.shadowBlur = 12;
              ctx.fill();
              ctx.shadowBlur = 0;
              ctx.closePath();

              ctx.beginPath();
              ctx.arc(x, y, 12, 0, Math.PI * 2);
              ctx.strokeStyle = '#34d399';
              ctx.lineWidth = 1.5;
              ctx.stroke();
              ctx.closePath();
            }
          }

          if (!isDragging.current) {
            setRotation(prev => prev + 0.3);
          }
          animationFrameId = requestAnimationFrame(render);
        };

        render();
        return () => cancelAnimationFrame(animationFrameId);
      }, [country, rotation]);

      const handleMouseDown = (e) => {
        isDragging.current = true;
        lastMouseX.current = e.clientX;
      };

      const handleMouseMove = (e) => {
        if (!isDragging.current) return;
        const deltaX = e.clientX - lastMouseX.current;
        setRotation(prev => prev + deltaX * 0.6);
        lastMouseX.current = e.clientX;
      };

      const handleMouseUp = () => {
        isDragging.current = false;
      };

      return (
        <div className="flex flex-col items-center bg-slate-950/80 border border-slate-800 p-3 rounded-xl shadow-inner">
          <span className="text-[10px] font-mono text-slate-400 uppercase tracking-widest mb-1">Global Location</span>
          <canvas
            ref={canvasRef}
            width={180}
            height={160}
            onMouseDown={handleMouseDown}
            onMouseMove={handleMouseMove}
            onMouseUp={handleMouseUp}
            onMouseLeave={handleMouseUp}
            className="cursor-grab active:cursor-grabbing rounded-lg bg-slate-950"
          ></canvas>
        </div>
      );
    }

    function App() {
      const [viewMode, setViewMode] = useState('viewer');

      const [isLoggedIn, setIsLoggedIn] = useState(() => {
        return localStorage.getItem('world_history_auth') === 'true';
      });
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [loginUser, setLoginUser] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [loginError, setLoginError] = useState('');

      const [countries, setCountries] = useState(() => {
        const saved = localStorage.getItem('world_history_countries');
        return saved ? JSON.parse(saved) : INITIAL_COUNTRIES;
      });

      const [events, setEvents] = useState(() => {
        const saved = localStorage.getItem('world_history_events');
        return saved ? JSON.parse(saved) : INITIAL_EVENTS;
      });

      const [lastUsedCountryId, setLastUsedCountryId] = useState(() => {
        return localStorage.getItem('world_history_last_country') || '';
      });

      // Viewer state
      const [viewerCountryId, setViewerCountryId] = useState(() => countries[0]?.id || '');
      // Admin dashboard selected country filter ('ALL' or specific country ID)
      const [adminSelectedCountry, setAdminSelectedCountry] = useState('ALL');

      useEffect(() => {
        localStorage.setItem('world_history_countries', JSON.stringify(countries));
      }, [countries]);

      useEffect(() => {
        localStorage.setItem('world_history_events', JSON.stringify(events));
      }, [events]);

      const [sortAscending, setSortAscending] = useState(true);

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isAddingCountry, setIsAddingCountry] = useState(false);
      const [editingItem, setEditingItem] = useState(null);

      const [formData, setFormData] = useState({
        countryId: '',
        title: '',
        yearStart: '',
        yearEnd: '',
        category: 'War',
        type: 'Event',
        description: '',
        tags: '',
        outcome: '',
        aggressorId: '',
        customerId: '',
      });

      const [newCountry, setNewCountry] = useState({ name: '', era: 'Present', continent: '', lat: 0, lng: 0 });

      const sortedCountriesAlphabetical = useMemo(() => {
        return [...countries].sort((a, b) => a.name.localeCompare(b.name));
      }, [countries]);

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        if (loginUser === AUTH_USER && loginPass === AUTH_PASS) {
          setIsLoggedIn(true);
          localStorage.setItem('world_history_auth', 'true');
          setShowLoginModal(false);
          setViewMode('admin');
          setLoginError('');
          setLoginUser('');
          setLoginPass('');
        } else {
          setLoginError('Invalid username or password');
        }
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        localStorage.removeItem('world_history_auth');
        setViewMode('viewer');
      };

      const formatYear = (year) => {
        if (year === null || year === '' || isNaN(year)) return '';
        const y = Number(year);
        return y < 0 ? `${Math.abs(y)} BCE` : `${y} CE`;
      };

      const handleRandomCountry = () => {
        if (countries.length === 0) return;
        const randomIndex = Math.floor(Math.random() * countries.length);
        setViewerCountryId(countries[randomIndex].id);
      };

      const openAddModal = () => {
        setEditingItem(null);
        const defaultCountry = 
          (lastUsedCountryId && countries.some(c => c.id === lastUsedCountryId) && lastUsedCountryId) ||
          (viewerCountryId) ||
          (countries[0]?.id || '');

        setFormData({ 
          countryId: defaultCountry, 
          title: '', 
          yearStart: '', 
          yearEnd: '', 
          category: 'War', 
          type: 'Event', 
          description: '', 
          tags: '',
          outcome: '',
          aggressorId: '',
          customerId: '',
        });
        setIsModalOpen(true);
      };

      const openEditModal = (item) => {
        setEditingItem(item);
        setFormData({
          countryId: item.countryId,
          title: item.title,
          yearStart: item.yearStart,
          yearEnd: item.yearEnd !== null ? item.yearEnd : '',
          category: item.category,
          type: item.type || (item.yearEnd ? 'Period' : 'Event'),
          description: item.description || '',
          tags: item.tags || '',
          outcome: item.outcome || '',
          aggressorId: item.aggressorId || '',
          customerId: item.customerId || '',
        });
        setIsModalOpen(true);
      };

      const handleSaveItem = (e) => {
        e.preventDefault();
        if (!formData.title || !formData.countryId || formData.yearStart === '') return;

        const isMilitary = MILITARY_CATEGORIES.includes(formData.category);
        const isPossessive = POSSESSIVE_CATEGORIES.includes(formData.category);

        const payload = {
          id: editingItem ? editingItem.id : 'e_' + Date.now(),
          countryId: formData.countryId,
          title: formData.title,
          yearStart: parseInt(formData.yearStart, 10),
          yearEnd: formData.type === 'Period' && formData.yearEnd !== '' ? parseInt(formData.yearEnd, 10) : null,
          category: formData.category,
          type: formData.type,
          description: formData.description,
          tags: formData.tags,
          outcome: isMilitary ? formData.outcome : '',
          aggressorId: isMilitary ? formData.aggressorId : '',
          customerId: isPossessive ? formData.customerId : '',
        };

        if (editingItem) {
          setEvents(events.map((ev) => (ev.id === editingItem.id ? payload : ev)));
        } else {
          setEvents([...events, payload]);
          setLastUsedCountryId(formData.countryId);
          localStorage.setItem('world_history_last_country', formData.countryId);
        }
        setIsModalOpen(false);
      };

      const handleDeleteItem = (id) => {
        if (confirm('Are you sure you want to delete this timeline item?')) {
          setEvents(events.filter((ev) => ev.id !== id));
        }
      };

      const handleAddCountry = (e) => {
        e.preventDefault();
        if (!newCountry.name) return;
        const newId = 'c_' + Date.now();
        setCountries([...countries, { 
          id: newId, 
          name: newCountry.name, 
          era: newCountry.era, 
          continent: newCountry.continent || 'Global',
          lat: parseFloat(newCountry.lat) || 0,
          lng: parseFloat(newCountry.lng) || 0
        }]);
        setIsAddingCountry(false);
        setNewCountry({ name: '', era: 'Present', continent: '', lat: 0, lng: 0 });
      };

      const handleDeleteCountry = (countryId, countryName, e) => {
        e.stopPropagation();
        if (confirm(`Are you sure you want to delete "${countryName}"? This will also remove all associated timeline events and periods.`)) {
          setCountries(countries.filter((c) => c.id !== countryId));
          setEvents(events.filter((ev) => ev.countryId !== countryId));
          if (viewerCountryId === countryId && countries.length > 1) {
            setViewerCountryId(countries.find(c => c.id !== countryId)?.id || '');
          }
          if (adminSelectedCountry === countryId) {
            setAdminSelectedCountry('ALL');
          }
        }
      };

      // Viewer timeline computation
      const viewerEvents = useMemo(() => {
        const targetCountryEvents = events
          .filter(ev => ev.countryId === viewerCountryId)
          .sort((a, b) => (sortAscending ? a.yearStart - b.yearStart : b.yearStart - a.yearStart));

        return targetCountryEvents.map((ev, idx, arr) => {
          const duration = ev.yearEnd !== null && !isNaN(ev.yearEnd) ? Math.max(1, Math.abs(ev.yearEnd - ev.yearStart)) : 1;
          const proportionalHeight = Math.min(Math.max(duration * 4, 32), 240);

          let gapPx = 30;
          if (idx > 0) {
            const prevYear = arr[idx - 1].yearStart;
            const yearDiff = Math.abs(ev.yearStart - prevYear);
            gapPx = Math.min(Math.max(Math.sqrt(yearDiff) * 8, 20), 180);
          }

          return { ...ev, proportionalHeight, gapPx };
        });
      }, [events, viewerCountryId, sortAscending]);

      const viewerActivePeriods = useMemo(() => {
        return viewerEvents.filter(item => item.type === 'Period' && item.yearEnd !== null);
      }, [viewerEvents]);

      const selectedViewerCountryObj = countries.find(c => c.id === viewerCountryId);

      // Admin filtered events
      const adminFilteredEvents = useMemo(() => {
        return events
          .filter(ev => adminSelectedCountry === 'ALL' || ev.countryId === adminSelectedCountry)
          .sort((a, b) => (sortAscending ? a.yearStart - b.yearStart : b.yearStart - a.yearStart));
      }, [events, adminSelectedCountry, sortAscending]);

      return (
        <div className="max-w-7xl mx-auto px-4 py-8">
          {/* Aesthetic Title and Central Edit Button Header */}
          <header className="flex flex-col items-center justify-center border-b border-slate-800 pb-8 mb-8 gap-6 text-center">
            <div>
              <h1 className="text-4xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400 drop-shadow-sm">
                Chronicles of World History
              </h1>
            </div>

            <div className="flex flex-wrap items-center justify-center gap-3 w-full">
              {viewMode === 'viewer' ? (
                isLoggedIn ? (
                  <button
                    onClick={() => setViewMode('admin')}
                    className="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold rounded-xl shadow-lg shadow-emerald-950/50 transition transform hover:scale-105"
                  >
                    ⚙️ Edit Timeline
                  </button>
                ) : (
                  <button
                    onClick={() => setShowLoginModal(true)}
                    className="px-6 py-2.5 bg-amber-600 hover:bg-amber-500 text-white text-sm font-bold rounded-xl shadow-lg shadow-amber-950/50 transition transform hover:scale-105"
                  >
                    🔒 Edit Timeline (Login)
                  </button>
                )
              ) : (
                <button
                  onClick={() => setViewMode('viewer')}
                  className="px-6 py-2.5 bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold rounded-xl shadow-lg shadow-blue-950/50 transition transform hover:scale-105"
                >
                  👁️ Switch to Timeline Viewer
                </button>
              )}
            </div>
          </header>

          {/* VIEW MODE 1: TIMELINE VIEWER */}
          {viewMode === 'viewer' && (
            <div className="space-y-8">
              {/* Controls Bar */}
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <div className="lg:col-span-2 space-y-4 flex flex-col justify-center">
                  <div>
                    <label className="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">
                      Select Country
                    </label>
                    <div className="flex gap-3 items-center">
                      <div className="flex-1">
                        <SearchableDropdown
                          countries={countries}
                          value={viewerCountryId}
                          onChange={(id) => setViewerCountryId(id)}
                          placeholder="Select Country..."
                        />
                      </div>
                      <button
                        onClick={handleRandomCountry}
                        className="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold rounded-lg shadow transition flex items-center gap-1.5 whitespace-nowrap"
                      >
                        🎲 Random
                      </button>
                    </div>
                  </div>

                  <div className="flex flex-wrap items-center gap-4 pt-2">
                    <span className="text-xs text-slate-400">
                      Region: <strong className="text-slate-200">{selectedViewerCountryObj?.continent || 'Global'}</strong>
                    </span>
                    <button
                      onClick={() => setSortAscending(!sortAscending)}
                      className="ml-auto text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition"
                    >
                      Sort: {sortAscending ? 'Chronological (Old → New)' : 'Reverse (New → Old)'}
                    </button>
                  </div>
                </div>

                {/* Globe Card */}
                <div className="flex justify-center">
                  <GlobeCanvas country={selectedViewerCountryObj} />
                </div>
              </div>

              {/* Proportional Timeline Canvas */}
              <div className="bg-slate-950/70 border border-slate-800 rounded-2xl p-6">
                <div className="flex flex-col items-center justify-center mb-8 pb-4 border-b border-slate-800 text-center">
                  <h3 className="text-2xl font-black text-white tracking-wide">
                    {selectedViewerCountryObj?.name || 'Selected Nation'}
                  </h3>
                  <span className="text-xs font-mono text-emerald-400 mt-1 font-semibold">
                    {viewerEvents.length} item{viewerEvents.length !== 1 ? 's' : ''} recorded
                  </span>
                </div>

                {viewerEvents.length === 0 ? (
                  <div className="text-center py-20 text-slate-500">
                    No historical events recorded for {selectedViewerCountryObj?.name}. Switch to Edit mode to add some!
                  </div>
                ) : (
                  <div className="relative border-l-2 border-slate-700 ml-6 pl-8 space-y-4">
                    {viewerEvents.map((ev, idx) => {
                      const catStyle = CATEGORIES[ev.category] || CATEGORIES.War;
                      const isPeriod = ev.type === 'Period' || ev.yearEnd !== null;

                      const overlappingPeriods = viewerActivePeriods.filter(
                        (p) => p.id !== ev.id && ev.yearStart >= p.yearStart && ev.yearStart <= p.yearEnd
                      );

                      const hostCountryName = selectedViewerCountryObj?.name || 'Country';
                      const aggressorObj = countries.find(c => c.id === ev.aggressorId);
                      const customerObj = countries.find(c => c.id === ev.customerId);

                      return (
                        <div
                          key={ev.id}
                          style={{ marginTop: idx === 0 ? '0px' : `${ev.gapPx}px` }}
                          className="relative transition-all"
                        >
                          {overlappingPeriods.map((period) => {
                            const pStyle = CATEGORIES[period.category] || CATEGORIES['Era/Economic'];
                            return (
                              <div
                                key={period.id}
                                className={`absolute -inset-x-4 -inset-y-2 rounded-lg border ${pStyle.highlight} pointer-events-none z-0`}
                              >
                                <span className="absolute right-3 top-1 text-[9px] uppercase font-bold tracking-widest text-slate-500">
                                  Inside Period: {period.title}
                                </span>
                              </div>
                            );
                          })}

                          <div className={`absolute -left-[37px] top-4 w-4 h-4 rounded-full border-2 ${catStyle.border} bg-slate-950 z-10`}></div>

                          <div
                            style={{ minHeight: `${ev.proportionalHeight}px` }}
                            className={`relative z-10 p-5 rounded-xl border ${catStyle.bg} ${catStyle.border} shadow-xl flex flex-col justify-between`}
                          >
                            <div>
                              <div className="flex flex-wrap justify-between items-center mb-3 gap-2">
                                <div className="flex items-center gap-2 flex-wrap">
                                  <span className="text-xs font-mono font-bold bg-slate-900 px-2.5 py-1 rounded border border-slate-700">
                                    {formatYear(ev.yearStart)}
                                    {ev.yearEnd !== null && ` – ${formatYear(ev.yearEnd)}`}
                                  </span>
                                  <span className={`text-xs px-2.5 py-0.5 rounded-full font-semibold border ${catStyle.badge}`}>
                                    {catStyle.label}
                                  </span>
                                  
                                  {/* Dynamic Outcome tag */}
                                  {ev.outcome && (
                                    <span className={`text-xs px-2.5 py-0.5 rounded-full font-bold border ${
                                      ev.outcome === 'Win' ? 'bg-emerald-950 text-emerald-300 border-emerald-700' :
                                      ev.outcome === 'Loss' ? 'bg-red-950 text-red-300 border-red-700' :
                                      'bg-amber-950 text-amber-300 border-amber-700'
                                    }`}>
                                      {hostCountryName} {ev.outcome === 'Win' ? 'won' : ev.outcome === 'Loss' ? 'lost' : 'drew'}
                                    </span>
                                  )}

                                  {/* Aggressor display */}
                                  {aggressorObj && (
                                    <span className="text-xs px-2.5 py-0.5 rounded-full font-bold bg-orange-950 text-orange-300 border border-orange-700">
                                      Aggressor: {aggressorObj.name}
                                    </span>
                                  )}

                                  {/* Customer display */}
                                  {customerObj && (
                                    <span className="text-xs px-2.5 py-0.5 rounded-full font-bold bg-indigo-950 text-indigo-300 border border-indigo-700">
                                      Customer: {customerObj.name}
                                    </span>
                                  )}
                                </div>
                              </div>

                              {/* Event Name takes up entire timeline entry header */}
                              <h4 className="text-xl font-extrabold text-white w-full">{ev.title}</h4>
                              {ev.description && <p className="text-slate-300 text-sm mt-2">{ev.description}</p>}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* VIEW MODE 2: ADMIN EDIT DASHBOARD */}
          {viewMode === 'admin' && (
            <div className="space-y-8">
              {/* Phone Responsive Admin Header Top Bar */}
              <div className="flex flex-col sm:flex-row justify-between items-center bg-slate-900 border border-slate-800 p-4 rounded-xl gap-3">
                <span className="text-xs sm:text-sm font-semibold text-emerald-400 text-center sm:text-left">🔓 Logged in as Admin</span>
                <div className="flex flex-wrap justify-center gap-2 w-full sm:w-auto">
                  <button onClick={() => setIsAddingCountry(true)} className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs rounded-lg border border-slate-700">+ Nation</button>
                  <button onClick={openAddModal} className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-lg">+ Item</button>
                  <button onClick={() => setViewMode('viewer')} className="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs rounded-lg">Viewer</button>
                  <button onClick={handleLogout} className="px-3 py-1.5 bg-red-950/80 hover:bg-red-900 text-red-300 text-xs rounded-lg border border-red-800">Logout</button>
                </div>
              </div>

              {/* Layout */}
              <div className="grid grid-cols-1 lg:grid-cols-4 gap-8">
                {/* Nation Roster with Region in Description & Filter */}
                <div className="lg:col-span-1 bg-slate-900 border border-slate-800 rounded-xl p-4 h-fit space-y-4">
                  <div className="flex justify-between items-center">
                    <h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider">Nations ({countries.length})</h3>
                    {adminSelectedCountry !== 'ALL' && (
                      <button 
                        onClick={() => setAdminSelectedCountry('ALL')} 
                        className="text-[10px] text-emerald-400 underline hover:text-emerald-300"
                      >
                        Show All
                      </button>
                    )}
                  </div>
                  <div className="space-y-2 max-h-[600px] overflow-y-auto pr-1">
                    {sortedCountriesAlphabetical.map((c) => {
                      const isSelected = adminSelectedCountry === c.id;
                      return (
                        <div
                          key={c.id}
                          onClick={() => setAdminSelectedCountry(isSelected ? 'ALL' : c.id)}
                          className={`p-3 rounded-lg border cursor-pointer transition flex justify-between items-center ${
                            isSelected ? 'bg-emerald-950/60 border-emerald-500' : 'bg-slate-950 border-slate-800 hover:border-slate-700'
                          }`}
                        >
                          <div>
                            <div className="text-sm font-semibold text-slate-200">{c.name}</div>
                            <div className="text-[10px] text-slate-400 mt-0.5">Region: {c.continent || 'Global'}</div>
                          </div>
                          <button
                            onClick={(e) => handleDeleteCountry(c.id, c.name, e)}
                            title="Delete country"
                            className="hover:bg-red-900/60 text-slate-400 hover:text-red-300 rounded p-1 transition ml-2"
                          >
                            ✕
                          </button>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Admin Entries Stream */}
                <div className="lg:col-span-3">
                  <div className="flex justify-between items-center mb-4">
                    <span className="text-xs text-slate-400">
                      Showing entries for: <strong className="text-white">{adminSelectedCountry === 'ALL' ? 'All Nations' : countries.find(c => c.id === adminSelectedCountry)?.name}</strong>
                    </span>
                    <button
                      onClick={() => setSortAscending(!sortAscending)}
                      className="text-xs bg-slate-900 border border-slate-800 text-slate-300 px-3 py-1.5 rounded-lg"
                    >
                      Sort: {sortAscending ? 'Old → New' : 'New → Old'}
                    </button>
                  </div>

                  {adminFilteredEvents.length === 0 ? (
                    <div className="text-center py-16 bg-slate-900 border border-slate-800 rounded-xl text-slate-400">
                      No entries found for this selection.
                    </div>
                  ) : (
                    <div className="space-y-4">
                      {adminFilteredEvents.map((ev) => {
                        const country = countries.find((c) => c.id === ev.countryId);
                        const catStyle = CATEGORIES[ev.category] || CATEGORIES.War;
                        return (
                          <div key={ev.id} className={`p-5 rounded-xl border ${catStyle.bg} ${catStyle.border} shadow-md flex justify-between items-start`}>
                            <div>
                              <div className="flex items-center gap-2 mb-1 flex-wrap">
                                <span className="text-xs font-mono font-bold bg-slate-900 px-2.5 py-1 rounded border border-slate-700">
                                  {formatYear(ev.yearStart)}
                                  {ev.yearEnd !== null && ` – ${formatYear(ev.yearEnd)}`}
                                </span>
                                <span className={`text-xs px-2.5 py-0.5 rounded-full font-semibold border ${catStyle.badge}`}>
                                  {catStyle.label}
                                </span>
                              </div>
                              <h4 className="text-lg font-bold text-white mt-1">{ev.title}</h4>
                              {country && <span className="text-xs text-slate-400">🏛️ {country.name}</span>}
                            </div>
                            <div className="flex gap-2">
                              <button onClick={() => openEditModal(ev)} className="px-2.5 py-1 bg-slate-900 hover:bg-slate-800 text-slate-200 text-xs rounded border border-slate-700">Edit</button>
                              <button onClick={() => handleDeleteItem(ev.id)} className="px-2.5 py-1 bg-red-950 hover:bg-red-900 text-red-300 text-xs rounded border border-red-800">Delete</button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Login Modal */}
          {showLoginModal && (
            <div className="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 max-w-sm w-full shadow-2xl">
                <h3 className="text-xl font-bold text-white mb-2">Admin Login</h3>
                <p className="text-xs text-slate-400 mb-4">Enter credentials to access timeline editing features.</p>
                {loginError && <div className="mb-3 p-2 bg-red-950 border border-red-800 text-red-300 text-xs rounded">{loginError}</div>}
                <form onSubmit={handleLoginSubmit} className="space-y-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Username</label>
                    <input
                      type="text"
                      required
                      value={loginUser}
                      onChange={(e) => setLoginUser(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-amber-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Password</label>
                    <input
                      type="password"
                      required
                      value={loginPass}
                      onChange={(e) => setLoginPass(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-amber-500"
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowLoginModal(false)} className="px-4 py-2 bg-slate-800 text-slate-300 text-xs rounded font-medium">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white text-xs rounded font-semibold">Login</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Add / Edit Event Modal */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 max-w-md w-full shadow-2xl max-h-[90vh] overflow-y-auto">
                <h3 className="text-xl font-bold text-white mb-4">{editingItem ? 'Edit Timeline Item' : 'Add Timeline Item'}</h3>
                <form onSubmit={handleSaveItem} className="space-y-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Item Type *</label>
                    <select
                      value={formData.type}
                      onChange={(e) => setFormData({ ...formData, type: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500"
                    >
                      <option value="Event">Event (Single Point in Time)</option>
                      <option value="Period">Period (Multi-Year Range Highlight)</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Nation / Empire *</label>
                    <SearchableDropdown
                      countries={countries}
                      value={formData.countryId}
                      onChange={(id) => setFormData({ ...formData, countryId: id })}
                      placeholder="Select country..."
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Title *</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Battle of Waterloo"
                      value={formData.title}
                      onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Start Year *</label>
                      <input
                        type="number"
                        required
                        placeholder="-27 or 1945"
                        value={formData.yearStart}
                        onChange={(e) => setFormData({ ...formData, yearStart: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">
                        End Year {formData.type === 'Period' ? '(Required)' : '(Optional)'}
                      </label>
                      <input
                        type="number"
                        placeholder="End year"
                        required={formData.type === 'Period'}
                        value={formData.yearEnd}
                        onChange={(e) => setFormData({ ...formData, yearEnd: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Category</label>
                    <select
                      value={formData.category}
                      onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500"
                    >
                      <option value="War">War</option>
                      <option value="Invasion">Invasion</option>
                      <option value="Disaster">Disaster</option>
                      <option value="Founding">Founding</option>
                      <option value="Civil War">Civil War</option>
                      <option value="Policy">Policy</option>
                      <option value="Treaty">Treaty</option>
                      <option value="Policy/Treaty">Policy / Treaty (Legacy)</option>
                      <option value="Era">Era</option>
                      <option value="Economic">Economic</option>
                      <option value="Era/Economic">Era / Economic (Legacy)</option>
                      <option value="Building">Building</option>
                      <option value="Transfer">Transfer</option>
                      <option value="Skirmish">Skirmish</option>
                      <option value="Event">Event</option>
                      <option value="Raid">Raid</option>
                      <option value="Settled">Settled</option>
                      <option value="Claim">Claim</option>
                      <option value="Surrender/Loss">Surrender / Loss</option>
                      <option value="Purchase">Purchase</option>
                    </select>
                  </div>

                  {MILITARY_CATEGORIES.includes(formData.category) && (
                    <div className="space-y-3 p-3 bg-slate-950/60 rounded-lg border border-slate-800">
                      <div>
                        <label className="block text-xs font-semibold text-amber-400 mb-1">Military Outcome</label>
                        <select
                          value={formData.outcome}
                          onChange={(e) => setFormData({ ...formData, outcome: e.target.value })}
                          className="w-full bg-slate-950 border border-amber-800/60 rounded px-3 py-2 text-sm text-amber-200 focus:outline-none focus:border-amber-500"
                        >
                          <option value="">None / Not Applicable</option>
                          <option value="Win">Win</option>
                          <option value="Loss">Loss</option>
                          <option value="Draw">Draw</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-amber-400 mb-1">Aggressor Country</label>
                        <SearchableDropdown
                          countries={countries}
                          value={formData.aggressorId}
                          onChange={(id) => setFormData({ ...formData, aggressorId: id })}
                          placeholder="Select aggressor..."
                        />
                      </div>
                    </div>
                  )}

                  {POSSESSIVE_CATEGORIES.includes(formData.category) && (
                    <div className="p-3 bg-slate-950/60 rounded-lg border border-slate-800">
                      <label className="block text-xs font-semibold text-indigo-400 mb-1">Customer / Counterparty Country</label>
                      <SearchableDropdown
                        countries={countries}
                        value={formData.customerId}
                        onChange={(id) => setFormData({ ...formData, customerId: id })}
                        placeholder="Select customer/counterparty..."
                      />
                    </div>
                  )}

                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Description</label>
                    <textarea
                      placeholder="Context and notes..."
                      value={formData.description}
                      onChange={(e) => setFormData({ ...formData, description: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500"
                    ></textarea>
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 bg-slate-800 text-slate-300 text-xs rounded font-medium">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs rounded font-semibold">{editingItem ? 'Update Item' : 'Save Item'}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Add Country Modal */}
          {isAddingCountry && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 max-w-md w-full shadow-2xl">
                <h3 className="text-xl font-bold text-white mb-4">Add Country / Empire</h3>
                <form onSubmit={handleAddCountry} className="space-y-3">
                  <input type="text" required placeholder="Country Name" value={newCountry.name} onChange={(e) => setNewCountry({ ...newCountry, name: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-200" />
                  <select value={newCountry.era} onChange={(e) => setNewCountry({ ...newCountry, era: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-200">
                    <option value="Past">Past</option>
                    <option value="Present">Present</option>
                    <option value="Future">Future</option>
                  </select>
                  <input type="text" placeholder="Region / Continent" value={newCountry.continent} onChange={(e) => setNewCountry({ ...newCountry, continent: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-200" />
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-[10px] text-slate-400 mb-1">Latitude</label>
                      <input type="number" step="any" placeholder="e.g. 41.9" value={newCountry.lat} onChange={(e) => setNewCountry({ ...newCountry, lat: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded px-3 py-1.5 text-xs text-slate-200" />
                    </div>
                    <div>
                      <label className="block text-[10px] text-slate-400 mb-1">Longitude</label>
                      <input type="number" step="any" placeholder="e.g. 12.5" value={newCountry.lng} onChange={(e) => setNewCountry({ ...newCountry, lng: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded px-3 py-1.5 text-xs text-slate-200" />
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsAddingCountry(false)} className="px-4 py-2 bg-slate-800 text-slate-300 text-xs rounded font-medium">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs rounded font-semibold">Save Country</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
